  toast('Sauvegarde téléchargée.');
}

/* ---------------------------- IMPORT DES CONTACTS DU TÉLÉPHONE (.vcf) ----------------------------
   Le format vCard (.vcf) est le format standard d'export des contacts (iPhone, iCloud, Android…).
   On ne garde QUE les contacts avec une entreprise renseignée (poste/société) — les contacts
   personnels sans entreprise sont volontairement ignorés, pour ne pas noyer la base commerciale.
   Une déduplication est appliquée sur ce lot (téléphone/email/nom), utile quand les contacts sont
   synchronisés depuis plusieurs sources (iCloud, téléphone, autre sauvegarde) et se retrouvent en
   double. */
function decodeVCardValue(raw){
  return raw.replace(/\\n/gi, ' ').replace(/\\,/g, ',').replace(/\\;/g, ';').trim();
}
function parseVCF(text){
  const blocks = text.split(/BEGIN:VCARD/i).slice(1);
  return blocks.map(block => {
    const rawLines = block.split(/\r\n|\n|\r/);
    // "Dépliage" des lignes vCard repliées (une ligne continue sur la suivante si elle commence par une espace/tabulation)
    const lines = [];
    rawLines.forEach(line => {
      if(/^[ \t]/.test(line) && lines.length){
        lines[lines.length-1] += line.slice(1);
      } else if(line.trim()){
        lines.push(line);
      }
    });
    const card = {fn:'', org:'', title:'', tel:'', email:''};
    lines.forEach(line => {
      const idx = line.indexOf(':');
      if(idx<0) return;
      const key = line.slice(0, idx).split(';')[0].toUpperCase();
      const val = line.slice(idx+1);
      if(key==='FN' && !card.fn) card.fn = decodeVCardValue(val);
      else if(key==='N' && !card.fn){
        const parts = val.split(';');
        card.fn = [parts[1], parts[0]].filter(Boolean).join(' ').trim();
      }
      else if(key==='ORG' && !card.org) card.org = decodeVCardValue(val).split(';')[0];
      else if(key==='TITLE' && !card.title) card.title = decodeVCardValue(val);
      else if(key==='TEL' && !card.tel) card.tel = val.trim();
      else if(key==='EMAIL' && !card.email) card.email = val.trim().toLowerCase();
    });
    return card;
  }).filter(c => c.fn || c.org);
}
function normKeyLoose(s){
  return (s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
}
function normPhoneLoose(s){
  const digits = (s||'').replace(/\D/g,'');
  return digits.slice(-9); // les 9 derniers chiffres suffisent à identifier un même numéro, indicatif ou pas
}
function triggerImportContacts(){
  const input = document.getElementById('import-contacts-input');
  if(input) input.click();
}
function importContactsVCF(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const allCards = parseVCF(e.target.result);
      const proCards = allCards.filter(c => c.org); // on ignore les contacts sans entreprise renseignée

      // Déduplication au sein de ce lot (téléphone + email + nom, pour repérer les doublons venant
      // de plusieurs sources synchronisées) — on garde la fiche la plus complète en cas de doublon.
      const seen = new Map();
      let doublons = 0;
      proCards.forEach(c => {
        const keys = [normPhoneLoose(c.tel), c.email, normKeyLoose(c.fn)+normKeyLoose(c.org)].filter(Boolean);
        const existingKey = keys.find(k => seen.has(k));
        if(existingKey){
          const existing = seen.get(existingKey);
          const scoreNew = [c.tel,c.email,c.title,c.org].filter(Boolean).length;
          const scoreOld = [existing.tel,existing.email,existing.title,existing.org].filter(Boolean).length;
          if(scoreNew > scoreOld){
            keys.forEach(k => seen.set(k, c));
          }
          doublons++;
        } else {
          keys.forEach(k => seen.set(k, c));
        }
      });
      const uniqueCards = [...new Set(seen.values())];

      // Table de correspondance vers les entreprises déjà connues, pour rattacher plutôt que dupliquer
      const companyByKey = new Map();
      DB.companies.forEach(co => companyByKey.set(normKeyLoose(co.nom), co));

      let nouvellesEntreprises = 0, rattaches = 0;
      uniqueCards.forEach(c => {
        const key = normKeyLoose(c.org);
        let co = companyByKey.get(key);
        if(!co){
          co = {
            id: gen_id_client('newcont'), ref: 'CT-' + (DB.companies.length+1),
            nom: c.org, activite: '', secteur: 'Industrie',
            rue:'', codePostal:'', ville:'', adresse:'', region: null,
            tel:'', site:'', partenaire:'SENGO Expert direct', prestataire:'SENGO EXPERT',
            potentiel:'moyen', statutClient:'prospect', groupe:'',
            effectif:null, ca:null, lat:null, lon:null,
            resume:'Importée depuis vos contacts téléphone.', watch:[], strategie:'',
          };
          DB.companies.push(co);
          companyByKey.set(key, co);
          nouvellesEntreprises++;
        } else {
          rattaches++;
        }
        const [prenom, ...rest] = (c.fn||'').split(' ');
        DB.contacts.push({
          id: gen_id_client('newcontk'), companyId: co.id,
          prenom: prenom||'', nom: rest.join(' '),
          fonction: c.title||'', tel: c.tel||'', email: c.email||'',
          role: 'autre', notes: '',
        });
      });

      const ignoresPerso = allCards.length - proCards.length;
      render();
      toast(`${uniqueCards.length} contacts pro importés (${nouvellesEntreprises} nouvelles entreprises, ${rattaches} rattachés à l'existant, ${doublons} doublons ignorés, ${ignoresPerso} contacts personnels ignorés).`, 5000);
      setTimeout(saveNow, 1800); // laisse le temps de lire le résumé avant que la confirmation d'enregistrement ne le remplace
    }catch(err){
      console.error('Import contacts échoué', err);
      toast('Fichier .vcf invalide ou illisible.');
    }
  };
  reader.readAsText(file);
}
function gen_id_client(prefix){
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function withTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message || 'Délai dépassé')), ms)),
  ]);
}
async function getGraphToken(){
  if(!msalInstance) throw new Error('OneDrive indisponible (bibliothèque non chargée).');
  const account = msalInstance.getActiveAccount();
  if(!account) throw new Error('Non connecté.');
  try{
    const resp = await withTimeout(
      msalInstance.acquireTokenSilent({scopes: ONEDRIVE_SCOPES, account}),
      10000, 'Délai dépassé lors de la connexion silencieuse.'
    );
    return resp.accessToken;
  }catch(e){
    // La fenêtre pop-up de connexion peut rester bloquée sans jamais revenir, en particulier
    // dans une app installée sur l'écran d'accueil (mode "standalone") sur mobile — sans limite
    // de temps ici, un clic sur "Enregistrer" pouvait alors sembler "ne rien faire" indéfiniment,
    // sans aucun message d'erreur pour comprendre pourquoi.
    try{
      const resp = await withTimeout(
        msalInstance.acquireTokenPopup({scopes: ONEDRIVE_SCOPES}),
        15000, 'Délai dépassé lors de l\'ouverture de la fenêtre de connexion.'
      );
      return resp.accessToken;
    }catch(e2){
      throw new Error('Connexion à OneDrive impossible — déconnectez-vous puis reconnectez-vous (icône ☁️).');
    }
  }
}

async function downloadFromOneDrive(){
  const token = await getGraphToken();
  // cache:'no-store' + paramètre anti-cache : sans ça, le navigateur (surtout Safari mobile)
  // peut renvoyer une ancienne version mise en cache au lieu d'aller vérifier sur le serveur —
  // ce qui donnait l'impression qu'une modification faite sur un autre appareil "ne remontait
  // jamais", même après un rechargement manuel.
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${ONEDRIVE_FILENAME}:/content?_=${Date.now()}`, {
    headers: { 'Authorization': 'Bearer ' + token },
    cache: 'no-store',
  });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('Lecture OneDrive échouée (' + res.status + ')');
  return await res.json();
}

async function uploadToOneDrive(jsonString){
  const token = await getGraphToken();
  const createRes = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${ONEDRIVE_FILENAME}:/createUploadSession`, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }),
  });
  if(!createRes.ok) throw new Error('Préparation de l\'envoi OneDrive échouée (' + createRes.status + ')');
  const { uploadUrl } = await createRes.json();

  const bytes = new TextEncoder().encode(jsonString);
  const chunkSize = 5 * 1024 * 1024; // 5 Mo, multiple de 320 Kio requis par l'API Graph
  for(let start = 0; start < bytes.length; start += chunkSize){
    const end = Math.min(start + chunkSize, bytes.length);
    const chunk = bytes.slice(start, end);
    const res = await fetch(uploadUrl, {
      method: 'PUT',
      headers: {
        'Content-Length': String(chunk.length),
        'Content-Range': `bytes ${start}-${end-1}/${bytes.length}`,
      },
      body: chunk,
    });
    if(!res.ok && res.status !== 201 && res.status !== 202){
      throw new Error('Envoi OneDrive échoué (' + res.status + ')');
    }
  }
}

async function saveToOneDrive(){
  // "connecting" est accepté en plus de "connected" : c'est l'état transitoire utilisé par
  // reloadFromOneDrive() pour son propre affichage pendant qu'il délègue ici tout le travail —
  // sans ça, cette fonction se bloquait elle-même silencieusement dès qu'appelée depuis là.
  if(oneDriveStatus !== 'connected' && oneDriveStatus !== 'connecting') return;
  oneDriveError = ''; // on repart propre à chaque tentative — sinon une erreur passée resterait
                       // affichée indéfiniment, même une fois la connexion redevenue normale
  try{
    // Avant de pousser, on récupère et fusionne la dernière version distante — c'est l'étape
    // qui manquait auparavant : sans elle, deux appareils actifs en même temps s'écrasaient l'un
    // l'autre à CHAQUE sauvegarde normale (2 secondes après chaque modification), pas seulement
    // lors d'un rechargement explicite ou de la vérification toutes les 20 secondes. Cette même
    // fonction sert donc désormais de point unique de synchronisation, appelé de partout.
    const before = snapshotDataOnly(buildSnapshot());
    const remoteSnap = await downloadFromOneDrive();
    if(remoteSnap) mergeSnapshot(remoteSnap);
    const after = snapshotDataOnly(buildSnapshot());
    await uploadToOneDrive(JSON.stringify(buildSnapshot()));
    oneDriveLastSync = new Date();
    if(before !== after){
      // La fusion a intégré une modification faite ailleurs : on l'affiche tout de suite.
      if(!DB.companies.find(c=>c.id===state.selectedCompanyId)){
        state.selectedCompanyId = computeStartingCompanyId();
      }
      render();
      toast('🔄 Synchronisé avec un autre appareil', 2200);
    } else {
      toast('✓ Enregistré', 1400);
    }
  }catch(e){
    console.error('Sauvegarde OneDrive échouée', e);
    oneDriveError = e.message || String(e);
    toast('⚠️ Échec de l\'enregistrement — ' + oneDriveError, 3500); // visible même sur mobile, où l'infobulle ne s'affiche jamais
    render();
  }
}

let __autoSaveTimer = null;
function scheduleAutoSave(){
  if(oneDriveStatus !== 'connected') return;
  clearTimeout(__autoSaveTimer);
  // Important : ne JAMAIS rafraîchir l'écran après une sauvegarde réussie (voir saveToOneDrive) —
  // un render() ici redéclencherait scheduleAutoSave() en boucle infinie toutes les 2 secondes,
  // fermant le clavier et réinitialisant tout défilement en cours à chaque cycle, même sans
  // aucune action de l'utilisateur.
  __autoSaveTimer = setTimeout(() => { __autoSaveTimer = null; saveToOneDrive(); }, 2000);
}

/* Sauvegarde immédiate — court-circuite le délai de 2 secondes. Utilisée par le bouton
   "Enregistrer" et par la validation au clavier (touche Entrée dans un champ). */
function saveNow(){
  clearTimeout(__autoSaveTimer);
  __autoSaveTimer = null;
  const btn = document.querySelector('.brand-save-btn');
  if(btn){ btn.classList.add('saving'); btn.disabled = true; }
  saveToOneDrive().finally(() => {
    // On recherche le bouton à nouveau plutôt que de garder l'ancienne référence : un rendu a pu
    // le recréer entre-temps (ex. si la fusion a rapatrié une modification faite ailleurs).
    const current = document.querySelector('.brand-save-btn');
    if(current){
      current.classList.remove('saving');
      current.disabled = false;
      if(!oneDriveError){
        // Confirmation verte réservée aux vrais succès — un échec est déjà signalé par le
        // message affiché séparément, pas besoin d'un signal contradictoire ("vert" = ok).
        current.classList.add('just-saved');
        setTimeout(() => {
          const c2 = document.querySelector('.brand-save-btn');
          if(c2) c2.classList.remove('just-saved');
        }, 1300);
      }
    }
  });
}

/* Valider par Entrée : plutôt que de laisser tourner une vérification automatique en tâche de
   fond toutes les X secondes (consommation inutile, et donne l'impression que l'app "mouline"
   sans arrêt), on enregistre sur demande — soit via le bouton "💾 Enregistrer", soit en appuyant
   sur Entrée une fois la saisie terminée dans un champ. Un délai de sécurité de 2 secondes après
   toute modification reste actif en filet de secours (scheduleAutoSave), au cas où la touche
   Entrée ne serait pas utilisée. */
function setupEnterToSave(){
  const handler = (e) => {
    const isEnter = e.key === 'Enter' || e.keyCode === 13 || e.which === 13;
    if(!isEnter) return;
    const el = e.target;
    if(!el || el.tagName !== 'INPUT') return; // pas les zones de texte multi-lignes (Entrée = saut de ligne)
    if(el.type === 'file' || el.type === 'checkbox') return;
    if(e.cancelable) e.preventDefault();
    el.blur(); // déclenche la mise à jour de la donnée (onblur existant sur la plupart des champs)
    setTimeout(saveNow, 80); // laisse le temps au blur/à sa mise à jour de s'exécuter avant d'enregistrer
  };
  // keydown ET keyup : certains claviers virtuels mobiles ne déclenchent fiablement l'un ou
  // l'autre selon les modèles/versions — écouter les deux maximise les chances que ça marche.
  document.addEventListener('keydown', handler);
  document.addEventListener('keyup', handler);
}

/* Rechargement manuel — l'app ne vérifie une éventuelle mise à jour OneDrive faite depuis un
   autre appareil qu'une seule fois, à la connexion. Si l'app reste ouverte longtemps pendant
   qu'une modification est faite ailleurs (téléphone, autre ordinateur), elle ne le sait jamais
   toute seule. Ce bouton force la remontée : on sauvegarde d'abord ce qui est en cours ici
   (pour ne rien perdre), puis on récupère la dernière version enregistrée sur OneDrive. */
async function reloadFromOneDrive(){
  if(oneDriveStatus !== 'connected'){
    toast('Connectez-vous d\'abord à OneDrive pour pouvoir recharger.');
    return;
  }
  oneDriveStatus = 'connecting';
  render();
  try{
    clearTimeout(__autoSaveTimer);
    __autoSaveTimer = null;
    await saveToOneDrive(); // récupère, fusionne et repousse en un seul point unique
    oneDriveStatus = 'connected';
  }catch(e){
    console.error('Rechargement OneDrive échoué', e);
    oneDriveStatus = 'connected';
    oneDriveError = e.message || String(e);
    toast('Le rechargement a échoué — réessayez.');
  }
  render();
  // On vient de pousser explicitement le résultat fusionné ci-dessus — le minuteur de sauvegarde
  // programmé par ce dernier render() serait redondant (repousserait la même chose une seconde
  // fois quelques secondes plus tard), on l'annule.
  clearTimeout(__autoSaveTimer);
  __autoSaveTimer = null;
}

async function connectOneDrive(){
  if(!msalInstance){
    toast('OneDrive indisponible pour le moment (bibliothèque non chargée — vérifiez votre connexion).');
    return;
  }
  oneDriveStatus = 'connecting';
  oneDriveError = '';
  render();
  try{
    const loginResp = await msalInstance.loginPopup({ scopes: ONEDRIVE_SCOPES, prompt: 'select_account' });
    msalInstance.setActiveAccount(loginResp.account);
    oneDriveAccountEmail = loginResp.account?.username || '';
    // On mémorise explicitement CE compte précis (au-delà de ce que gère MSAL lui-même) — sans
    // ça, si plusieurs comptes Microsoft ont déjà été utilisés sur cet appareil (ex. personnel
    // PUIS professionnel), un rechargement de page ne sait pas lequel des deux reprendre et peut
    // se reconnecter au mauvais.
    try{ localStorage.setItem('sengo_os_active_account', loginResp.account.homeAccountId); }catch(e){}
    const snap = await downloadFromOneDrive();
    if(snap){
      applySnapshot(snap);
      state.selectedCompanyId = computeStartingCompanyId();
      toast('Connecté (' + oneDriveAccountEmail + ') — données chargées.', 5000);
    } else {
      toast('Connecté (' + oneDriveAccountEmail + ') — première sauvegarde en cours…', 5000);
    }
    oneDriveStatus = 'connected';
    if(!snap) await saveToOneDrive();
  }catch(e){
    console.error('Connexion OneDrive échouée', e);
    oneDriveStatus = 'error';
    oneDriveError = e.message || String(e);
    toast('Connexion OneDrive échouée.');
  }
  render();
}

function disconnectOneDrive(){
  if(msalInstance) msalInstance.setActiveAccount(null);
  try{ localStorage.removeItem('sengo_os_active_account'); }catch(e){}
  oneDriveStatus = 'disconnected';
  oneDriveAccountEmail = '';
  toast('Déconnecté de OneDrive (les données restent enregistrées en ligne).');
  render();
}

async function initOneDrive(){
  try{
    const loaded = await loadMsalLibrary();
    if(!loaded || typeof msal === 'undefined'){
      oneDriveStatus = 'unavailable';
      render();
      return;
    }
    msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: ONEDRIVE_CLIENT_ID,
        authority: 'https://login.microsoftonline.com/common', // accepte comptes personnels ET professionnels (nécessite signInAudience = AzureADandPersonalMicrosoftAccount côté Azure)
        redirectUri: window.location.href.split('?')[0].split('#')[0],
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false },
    });
    await msalInstance.initialize();
    oneDriveStatus = 'disconnected';
    const accounts = msalInstance.getAllAccounts();
    if(accounts.length){
      // On retrouve le compte explicitement mémorisé lors de la dernière connexion volontaire,
      // plutôt que de prendre "le premier" trouvé en mémoire (qui peut être le mauvais si
      // plusieurs comptes ont déjà été utilisés ici — ex. personnel puis professionnel).
      let rememberedId = null;
      try{ rememberedId = localStorage.getItem('sengo_os_active_account'); }catch(e){}
      const account = (rememberedId && accounts.find(a => a.homeAccountId === rememberedId)) || accounts[0];
      msalInstance.setActiveAccount(account);
      oneDriveAccountEmail = account?.username || '';
      oneDriveStatus = 'connecting';
      render();
      const snap = await downloadFromOneDrive();
      applySnapshot(snap);
      state.selectedCompanyId = computeStartingCompanyId();
      oneDriveStatus = 'connected';
      toast('OneDrive : ' + oneDriveAccountEmail, 5000);
    }
  }catch(e){
    console.error('Restauration OneDrive échouée', e);
    oneDriveStatus = 'error';
    oneDriveError = e.message || String(e);
  }finally{
    render();
    // Ce qu'on vient de récupérer est déjà la version présente sur OneDrive — inutile de la
    // repousser aussitôt (voir la même remarque dans checkForRemoteUpdates).
    clearTimeout(__autoSaveTimer);
    __autoSaveTimer = null;
  }
}

// Premier affichage immédiat avec les données déjà en mémoire (démo ou dernière session) —
// ne dépend jamais du réseau. La connexion OneDrive se poursuit ensuite en tâche de fond et
// rafraîchit l'écran une fois prête (connectée, indisponible, ou en erreur).
function startApp(){
  state.selectedCompanyId = computeStartingCompanyId();
  render();
  initOneDrive();
  // Précharge la bibliothèque OCR en tâche de fond, sans bloquer l'affichage, pour que
  // le premier scan de carte de visite soit déjà rapide (sinon le premier essai peut
  // sembler ne rien faire le temps du téléchargement, qui ne se refait pas ensuite).
  loadOcrLibrary().catch(()=>{});
  setupPullToRefresh();
  setupEnterToSave();
}

/* ---------------------------- TIRER POUR ACTUALISER ----------------------------
   Geste tactile mobile classique : tirer vers le bas depuis le haut de la page déclenche
   une vérification manuelle des dernières données OneDrive (identique au bouton 🔄). */
function setupPullToRefresh(){
  let startY = null;
  let currentPull = 0;
  const PTR_THRESHOLD = 70;
  const indicator = document.getElementById('ptr-indicator');

  document.addEventListener('touchstart', (e) => {
    if(window.scrollY <= 0 && e.touches.length === 1){
      startY = e.touches[0].clientY;
      if(indicator) indicator.classList.add('dragging');
    } else {
      startY = null;
    }
  }, {passive:true});

  document.addEventListener('touchmove', (e) => {
    if(startY === null) return;
    const delta = e.touches[0].clientY - startY;
    if(delta > 0 && window.scrollY <= 0){
      currentPull = Math.min(delta, 120);
      if(indicator){
        indicator.style.transform = `translate(-50%, ${currentPull - 40}px)`;
        indicator.style.opacity = Math.min(currentPull / PTR_THRESHOLD, 1);
        indicator.textContent = currentPull > PTR_THRESHOLD ? '↑ Relâcher pour actualiser' : '↓ Tirer pour actualiser';
      }
    } else {
      startY = null;
      currentPull = 0;
      if(indicator){ indicator.classList.remove('dragging'); indicator.style.transform=''; indicator.style.opacity='0'; }
    }
  }, {passive:true});

  document.addEventListener('touchend', () => {
    if(startY === null) return;
    if(indicator){
      indicator.classList.remove('dragging');
      indicator.style.transform = '';
      indicator.style.opacity = '0';
    }
    if(currentPull > PTR_THRESHOLD){
      if(oneDriveStatus === 'connected') reloadFromOneDrive();
      else toast('Connectez-vous à OneDrive pour pouvoir actualiser ainsi.');
    }
    startY = null;
    currentPull = 0;
  }, {passive:true});
}

/* ---------------------------- MISE À JOUR AUTOMATIQUE EN ARRIÈRE-PLAN ----------------------------
   Vérifie périodiquement si une version plus récente existe sur OneDrive (ex. modification faite
   sur un autre appareil) et l'applique silencieusement — sans jamais interrompre une saisie en
   cours ni écraser une modification pas encore envoyée. */
function snapshotDataOnly(snap){
  // Compare uniquement les vraies données, jamais les champs techniques (horodatage de sauvegarde,
  // cache de département recalculé à l'affichage…) qui diffèrent toujours d'un appareil à l'autre
  // sans que ça ne reflète un vrai changement.
  const cleanCompanies = (snap.companies||[]).map(c => { const {_deptCache, ...rest} = c; return rest; });
  return JSON.stringify({
    companies: cleanCompanies, contacts: snap.contacts, tasks: snap.tasks,
    notes: snap.notes, opportunities: snap.opportunities, documents: snap.documents,
    tournees: snap.tournees,
  });
}
let __autoPullInterval = null;
function startAutoPull(){
  if(__autoPullInterval) clearInterval(__autoPullInterval);
  __autoPullInterval = setInterval(checkForRemoteUpdates, 20000); // toutes les 20 secondes
}
async function checkForRemoteUpdates(){
  if(oneDriveStatus !== 'connected') return;
  if(__autoSaveTimer) return; // une modification locale est en attente d'envoi : elle fera le travail
  if(state.ocrStatus) return; // un scan de carte est en cours
  const active = document.activeElement;
  const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  if(isTyping) return; // ne jamais interrompre une saisie en cours, même dans un champ sans rapport
  if(document.querySelector('.modal-overlay')) return; // ne pas perturber une fenêtre modale ouverte
  try{
    await saveToOneDrive(); // récupère, fusionne et repousse en un seul point unique
  }catch(e){
    console.warn('Vérification automatique des mises à jour échouée', e);
  }
}

/* ---------------------------- VERROU D'ACCÈS ----------------------------
   Le fichier étant hébergé publiquement (GitHub Pages gratuit), cette étape empêche
   un visiteur occasionnel tombant sur le lien de voir quoi que ce soit. Ce n'est pas
   une sécurité forte (le code reste techniquement inspectable) : la vraie protection
   des données vient du fait qu'elles vivent uniquement sur OneDrive, jamais dans ce
   fichier. Ce verrou sert juste à dissuader une découverte accidentelle. */
const APP_LOCK_PASSWORD = 'Sengo2026';
const APP_LOCK_STORAGE_KEY = 'sengo_os_unlocked';
function isAppUnlocked(){
  try{ return localStorage.getItem(APP_LOCK_STORAGE_KEY) === '1'; }catch(e){ return false; }
}
function renderLockScreen(showError){
  document.getElementById('app').innerHTML = `
    <div class="lock-screen">
      <div class="lock-spinner"></div>
      <input type="password" id="lock-password" class="${showError?'lock-shake':''}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>`;
  const input = document.getElementById('lock-password');
  if(input){
    input.focus();
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  }
}
function tryUnlock(){
  const input = document.getElementById('lock-password');
  const val = input ? input.value : '';
  if(val === APP_LOCK_PASSWORD){
    try{ localStorage.setItem(APP_LOCK_STORAGE_KEY, '1'); }catch(e){}
    startApp();
  } else {
    renderLockScreen(true);
  }
}
if(isAppUnlocked()){
  startApp();
} else {
  renderLockScreen(false);
}
</script>
